[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "onepaste"
version = "1.3.2"
description = "Collect project code files into a single output for AI assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "emVisible"}
]
keywords = ["code", "collector", "ai", "llm", "context", "prompt", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/emVisible/codecollector"
Repository = "https://github.com/emVisible/codecollector.git"
Issues = "https://github.com/emVisible/codecollector/issues"

[project.scripts]
onepaste = "onepaste.cli:main"

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "tiktoken>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["onepaste"]

[tool.hatch.build.targets.sdist]
exclude = ["/website"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"