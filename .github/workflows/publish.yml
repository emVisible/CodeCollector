name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Must match the "environment" name configured in the PyPI Trusted Publisher
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing — no API token stored
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade build twine

      - name: Run tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Primary path: OIDC trusted publishing (no secret needed).
          # Optional fallback: add a repo secret named PYPI_API_TOKEN and it
          # takes precedence automatically; leave it unset for pure OIDC.
          password: ${{ secrets.PYPI_API_TOKEN }}
